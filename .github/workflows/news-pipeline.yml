name: News Pipeline (Write + Grammar + Plagiarism Check + WordPress Draft)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          COPYSCAPE_USERNAME: ${{ secrets.COPYSCAPE_USERNAME }}
          COPYSCAPE_API_KEY: ${{ secrets.COPYSCAPE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHECKS_ENABLED: ${{ secrets.CHECKS_ENABLED }}
          MAX_ARTICLES_OVERRIDE: ${{ secrets.MAX_ARTICLES_OVERRIDE }}
        run: python news_pipeline.py

      - name: Commit updated seen_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json
          if git diff --staged --quiet; then
            echo "No changes to seen_articles.json, nothing to commit."
          else
            git commit -m "Update seen articles [skip ci]"
            git pull --rebase --autostash
            git push
          fi
