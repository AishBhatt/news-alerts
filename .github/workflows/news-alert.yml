name: News Alerts to Slack

on:
  schedule:
        - cron: "*/10 * * * *"   # every 10 minutes - active
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run news alert script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 news_alert.py

      - name: Commit updated seen.json
        run: |
          git config user.name "news-alert-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen items"
          git pull --rebase origin main
          git push
